<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games by Emerson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700;800&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --amber:#e8c07a; --dim:#6f6455; --paper:#d9cdb4; --line:#33291d; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0a0805; color:var(--paper);
    font-family:'Barlow Condensed',ui-sans-serif,system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px;
    -webkit-font-smoothing:antialiased;
  }
  /* CRT scanlines */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 4px);
  }
  .screen{width:min(600px,100%)}

  h1{
    font-family:'Bitter',Georgia,serif; font-weight:800;
    font-size:clamp(34px,7.5vw,58px); line-height:1; letter-spacing:-.01em;
    color:var(--amber); text-shadow:0 0 22px rgba(232,192,122,.28);
  }
  .sub{
    font-size:13px; letter-spacing:.4em; text-transform:uppercase;
    color:var(--dim); margin-top:14px; text-indent:.4em;
  }
  hr{border:0; border-top:1px solid var(--line); margin:26px 0 22px}

  .menu{list-style:none}
  .row{
    display:flex; align-items:baseline; gap:12px;
    padding:9px 0 9px 26px; position:relative;
    font-size:19px; letter-spacing:.06em; color:var(--dim);
    text-decoration:none; cursor:default;
  }
  .row .num{font-variant-numeric:tabular-nums; width:26px; flex:0 0 auto}
  .row .name{white-space:nowrap; text-transform:uppercase}
  .row .dots{flex:1; border-bottom:1px dotted var(--line); transform:translateY(-5px)}
  .row .state{flex:0 0 auto; font-size:14px; letter-spacing:.2em}

  .row.open{color:var(--paper); cursor:pointer}
  .row.open .name{color:var(--paper)}
  .row.open .state{color:var(--amber)}
  .row.sel{color:var(--amber)}
  .row.sel .name,.row.sel .state{color:var(--amber)}
  .row.sel .dots{border-bottom-color:#4c3d28}
  .row.sel::before{
    content:"\25B6"; position:absolute; left:2px; top:50%; transform:translateY(-50%);
    font-size:13px; color:var(--amber); animation:blink 1.05s steps(1) infinite;
  }
  .row.locked{opacity:.62}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}

  .note{margin-top:26px; font-size:14px; line-height:1.5; color:var(--dim)}
  .note kbd{font-family:'Barlow Condensed'; font-size:13px; padding:1px 7px;
    border:1px solid var(--line); color:var(--paper)}
  footer{margin-top:30px; font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; color:#4e4538}
</style>
</head>
<body>
<div class="screen">
  <h1>GAMES BY<br>EMERSON</h1>
  <div class="sub">Select a game</div>
  <hr>

  <ul class="menu" id="menu">
    <li><a class="row open sel" href="hollow.html">
      <span class="num">01</span><span class="name">Hollow</span>
      <span class="dots"></span><span class="state">Play</span></a></li>
    <li><span class="row locked">
      <span class="num">02</span><span class="name">Untitled</span>
      <span class="dots"></span><span class="state">Empty</span></span></li>
    <li><span class="row locked">
      <span class="num">03</span><span class="name">Untitled</span>
      <span class="dots"></span><span class="state">Empty</span></span></li>
    <li><span class="row locked">
      <span class="num">04</span><span class="name">Untitled</span>
      <span class="dots"></span><span class="state">Empty</span></span></li>
  </ul>

  <p class="note"><kbd>&uarr;</kbd> <kbd>&darr;</kbd> to choose, <kbd>Enter</kbd> to play. Or just click.</p>
  <footer>One hundred doors and counting</footer>
</div>

<script>
  var rows = Array.prototype.slice.call(document.querySelectorAll('.row'));
  var playable = rows.filter(function(r){ return r.classList.contains('open'); });
  var i = rows.indexOf(playable[0]);

  function select(n){
    if(n < 0) n = rows.length - 1;
    if(n >= rows.length) n = 0;
    rows[i].classList.remove('sel');
    i = n;
    rows[i].classList.add('sel');
  }
  function go(){
    var r = rows[i];
    if(r.tagName === 'A') window.location.href = r.getAttribute('href');
  }
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowDown'){ select(i+1); e.preventDefault(); }
    else if(e.key === 'ArrowUp'){ select(i-1); e.preventDefault(); }
    else if(e.key === 'Enter'){ go(); }
  });
  rows.forEach(function(r, n){
    r.addEventListener('mouseenter', function(){ select(n); });
  });
</script>
</body>
</html>
